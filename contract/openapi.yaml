  /api/v1/purchases/{id}/mark-paid:
    post:
      tags:
      - Purchases
      summary: Confirm the money arrived, creating the athlete's package.
      description: 'The only status transition this API has: Pending to Paid. There
        is no cancel, no partial payment, and a paid purchase never returns to Pending
        - corrections and refunds are outside this scope. In one transaction this
        records who confirmed and when, creates the purchased package from the STORED
        SNAPSHOT rather than from the catalogue, and links the two. The response carries
        the purchase and the package as they both stand afterwards, so the app does
        not have to re-read them separately. It is IDEMPOTENT: repeating it returns
        200 with the same purchase and the same package id and alreadyPaid: true.
        It never produces a second package, however many times or however concurrently
        it is called - safe to retry after a timeout. 409 ACTIVE_PACKAGE_EXISTS if
        the athlete has acquired an active package since selecting (BR-03); the purchase
        is LEFT PENDING and can be confirmed once that package is closed.'
      operationId: MarkPurchasePaid
      parameters:
