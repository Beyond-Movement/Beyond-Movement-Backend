  /api/v1/me/purchases:
    post:
      tags:
      - Purchases
      summary: Select a package to buy, creating a pending purchase request.
      description: 'Send only the packageOptionId. The name, session count, features,
        price and currency are resolved server-side and snapshotted onto the purchase
        - the price from the same rule that produced the number in GET /api/v1/catalogue,
        so the app never calculates loyalty, custom pricing, discounts or rounding,
        and a later edit to the option or to this athlete''s pricing cannot change
        a purchase that already exists. The purchase starts Pending; no package exists
        yet and an athlete can never activate one. Show the athlete GET /api/v1/payments/instapay-instructions
        next. An athlete may have only ONE pending purchase: posting a different option
        while one is pending REPLACES the selection on it and returns 200 with the
        same purchase id, re-priced at today''s rules. A new request returns 201.
