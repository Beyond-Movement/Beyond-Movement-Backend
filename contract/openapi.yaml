        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes/{id}/reactivate:
    post:
      tags:
      - Athletes
      summary: Restore a paused athlete's access.
      description: Sets account status back to Active. Issues no tokens - the athlete
        signs in again themselves, since the tokens revoked at pause are gone for
        good. Reactivating an already-active athlete succeeds and changes nothing.
