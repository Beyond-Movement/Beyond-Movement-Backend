# Beyond Movement API contract.
# Generated from the running API: GET /openapi/v1.json, converted to YAML.
# Do not hand-edit - regenerate after changing an endpoint, and record the
# change in contract/CHANGELOG.md.
openapi: 3.1.1
info:
  title: BeyondMovement.Api | v1
  version: 1.0.0
servers:
- url: http://localhost:5229/
paths:
  /api/v1/ping:
    get:
      tags:
      - BeyondMovement.Api
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Create an account from a validated invitation, and redeem it.
      description: 'Establishes authentication and nothing else — it does not collect a name. Post the
        registrationToken from /invitations/validate together with EITHER a password OR a googleIdToken
        — exactly one, never both. With Google, the account''s verified email must match the invited address
        or the request is refused with GOOGLE_EMAIL_MISMATCH. Returns the same token pair as login, so
        the app is signed in immediately, but user.profileCompleted is false and user.fullName is null
        (or Google''s display name, as a prefill): route to Complete Profile, not Home. The invitation
        is redeemed only on success, and re-posting the same token afterwards returns INVITATION_USED.'
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/athletes/me/profile:
    post:
      tags:
      - Athletes
      summary: Fill in the athlete's own profile after registration.
      description: Athlete-only, and always scoped to the caller's own profile — the user id comes from
        the token, never the body. fullName, dateOfBirth, gender and sport are all required and enforced
        here, not only in the app. Sets profileCompleted to true, after which both /auth/me and every
        later authentication response report it as true and guarantee a non-null fullName, so the app
        routes to Home instead of Complete Profile. Safe to call again to edit the details. Profile photo
        is not accepted yet; it needs file storage, which arrives in phase 13, and the app shows initials
        until then.
      operationId: CompleteAthleteProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfileResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/me/preferences:
    put:
      tags:
      - Authentication
      summary: Save the signed-in user's UI preferences.
      description: Stored server-side rather than on the device, so the chosen athlete-list sort survives
        a restart and follows the coach to another device. The saved value also comes back on every authentication
        response and from /auth/me, so the app can apply it at startup without an extra call.
      operationId: UpdatePreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Exchange email and password for an access token and a refresh token.
      description: 'Returns 401 INVALID_CREDENTIALS for both a wrong password and an unknown address —
        the two are deliberately indistinguishable. Returns 423 ACCOUNT_LOCKED after five failed attempts,
        with retryAfterSeconds and a Retry-After header. Returns 403 ACCOUNT_PAUSED when the credentials
        are correct but the account is paused. user.profileCompleted tells the app where to go next without
        a further call: false means route to Complete Profile rather than Home.'
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '423':
          description: Locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/google:
    post:
      tags:
      - Authentication
      summary: Sign in with a Google ID token obtained by the native sign-in on the device.
      description: Authentication only — it never creates an account (BR-01). If the Google account is
        unknown and no user exists with the same verified email, returns 403 INVITATION_REQUIRED. If a
        password account already exists for that verified email, the Google identity is linked to it and
        tokens are returned. Returns 401 INVALID_GOOGLE_TOKEN when the token fails verification or the
        Google email is unverified.
      operationId: GoogleSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token for a new token pair.
      description: 'Refresh tokens are single-use. Each call returns a NEW refresh token; store it and
        discard the old one. Replaying a token that was already spent is treated as theft: every token
        in that family is revoked and 401 INVALID_REFRESH_TOKEN is returned, so the user must sign in
        again. An expired or revoked token returns the same 401. Returns 403 ACCOUNT_PAUSED if the account
        was paused since the token was issued.'
      operationId: Refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the presented refresh token.
      description: Requires a valid access token as well as the refresh token in the body (architecture
        section 14.1 marks logout as authenticated). Succeeds even if the refresh token is already unknown
        or revoked, so a retry is safe.
      operationId: Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Send a password reset link to the address, if an account exists.
      description: Always returns 200, whether or not the address exists — it cannot be used to discover
        accounts, so never show a 'no account found' message. When an account does exist, an email is
        sent containing a deep link of the form beyondmovement://reset-password?token=<token>. The token
        is single-use, expires after one hour, and is URL-encoded in the link, so decode it before sending
        it to /auth/reset-password.
      operationId: ForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Set a new password using the token from the reset email.
      description: The token is single-use and valid for one hour; a used, unknown or expired token returns
        400 INVALID_RESET_TOKEN. On success every refresh token for that user is revoked, so any other
        signed-in device is signed out. Passwords must be at least 8 characters and are rejected if they
        appear on a common-password list; both arrive as 400 VALIDATION_FAILED with per-field messages
        in 'errors'.
      operationId: ResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication
      summary: Change the password while signed in.
      description: Requires the current password. Returns 401 INVALID_CREDENTIALS if it is wrong, and
        400 PASSWORD_NOT_SET for a Google-only account that has no password yet — those accounts set a
        first password through Forgot Password. On success every refresh token for the user is revoked,
        including this device's, so the app must sign in again.
      operationId: ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: The signed-in user, for restoring a session on app start.
      description: Read live from the database, not from the token, so a role or status changed since
        the token was issued is reflected immediately. Returns 403 ACCOUNT_PAUSED if the account was paused
        after this access token was issued — treat that as an immediate sign-out. When profileCompleted
        is false, route the user to Complete Profile rather than Home. minimumSupportedAppVersion drives
        the forced-upgrade prompt.
      operationId: CurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/validate:
    get:
      tags:
      - Invitations
      summary: Check an emailed invitation code and start account creation.
      description: Does NOT consume the invitation — it is redeemed only when the account is created,
        so a user may validate, abandon Create Account, and come back. Returns the invited email (show
        it read-only on Create Account; it is already verified, because only that inbox received the code)
        and a short-lived registrationToken to post to /auth/register. Failures distinguish INVITATION_INVALID,
        INVITATION_EXPIRED, INVITATION_USED and INVITATION_REVOKED so the error screen can say something
        useful. Rate-limited to 10 attempts per hour per IP; exceeding it returns 429 TOO_MANY_REQUESTS
        with retryAfterSeconds in the body and a Retry-After header, both in seconds.
      operationId: ValidateInvitation
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateInvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/invitations:
    post:
      tags:
      - Invitations
      summary: Invite an athlete by email address.
      description: The backend generates the code and emails it directly to the address — the response
        never contains it, so the Admin cannot pass it on by another route. Re-inviting an address that
        already has a pending invitation replaces the old code rather than creating a second one. Returns
        409 EMAIL_ALREADY_REGISTERED if an account exists.
      operationId: CreateInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
    get:
      tags:
      - Invitations
      summary: List invitations, newest first, optionally filtered by status.
      operationId: ListInvitations
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/InvitationStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/{id}/resend:
    post:
      tags:
      - Invitations
      summary: Issue a fresh code and email it again.
      description: The previous code stops working immediately, so only one code is ever live.
      operationId: ResendInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/{id}:
    delete:
      tags:
      - Invitations
      summary: Cancel a pending invitation.
      description: An already-redeemed invitation cannot be revoked — deleting the account is a separate
        action.
      operationId: RevokeInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes:
    get:
      tags:
      - Athletes
      summary: The coach's athletes, searchable, filterable and sorted.
      description: 'search matches full name, email or sport, case-insensitively, on any part of the value,
        and is trimmed before use. Email is included so an athlete who has not yet completed their profile,
        and so has no name, is still findable. status filters by ACCOUNT status - whether the athlete
        can sign in - and is not the same as having an active package, which arrives in phase 4 as a separate
        parameter. sort accepts NameAsc, NameDesc, Sport, NewestFirst and OldestFirst; Sport places athletes
        with no sport last, and both name orders place athletes with no name last. page starts at 1 and
        pageSize is capped at 100 - values outside the range are clamped rather than rejected. Paused
        athletes are always included: pausing hides an athlete from themselves, never from their coach.
        Athletes who have registered but not completed their profile are also always included, with fullName
        null.'
      operationId: ListAthletes
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          default: All
          $ref: '#/components/schemas/AthleteStatusFilter'
      - name: sort
        in: query
        schema:
          default: NameAsc
          $ref: '#/components/schemas/AthleteListSort'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAthleteListItem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes/{id}:
    get:
      tags:
      - Athletes
      summary: One athlete, read-only.
      description: Read-only in phase 2 - there is no endpoint to change an athlete's personal details.
        phone is always null for now, because no screen collects one yet. Profile photo is deferred until
        file storage exists. An unknown id, another coach's athlete and a deleted athlete all return 404
        ATHLETE_NOT_FOUND.
      operationId: GetAthlete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteDetail'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes/{id}/pause:
    post:
      tags:
      - Athletes
      summary: Suspend an athlete's access.
      description: Sets account status to Paused and revokes every refresh token the athlete holds, so
        the session cannot be renewed. Their current access token stays valid for its remaining minutes,
        but each request re-checks status, so the next call returns 403 ACCOUNT_PAUSED - login does the
        same. The athlete stays visible to the coach and their data is untouched. Pausing an already-paused
        athlete succeeds and changes nothing, so a retry is safe. Push device tokens are NOT yet revoked;
        that table arrives with notifications in phase 10.
      operationId: PauseAthlete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes/{id}/reactivate:
    post:
      tags:
      - Athletes
      summary: Restore a paused athlete's access.
      description: Sets account status back to Active. Issues no tokens - the athlete signs in again themselves,
        since the tokens revoked at pause are gone for good. Reactivating an already-active athlete succeeds
        and changes nothing.
      operationId: ReactivateAthlete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
components:
  schemas:
    ApiProblemDetails:
      required:
      - errorCode
      - correlationId
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          type: integer
          format: int32
        detail:
          type:
          - 'null'
          - string
        errorCode:
          enum:
          - VALIDATION_FAILED
          - INVALID_CREDENTIALS
          - ACCOUNT_LOCKED
          - ACCOUNT_PAUSED
          - INVALID_TOKEN
          - INVALID_REFRESH_TOKEN
          - INVALID_RESET_TOKEN
          - INVALID_GOOGLE_TOKEN
          - INVITATION_REQUIRED
          - PASSWORD_NOT_SET
          - INVITATION_INVALID
          - INVITATION_EXPIRED
          - INVITATION_USED
          - INVITATION_REVOKED
          - REGISTRATION_TOKEN_INVALID
          - GOOGLE_EMAIL_MISMATCH
          - EMAIL_ALREADY_REGISTERED
          - PROFILE_ALREADY_COMPLETED
          - TOO_MANY_REQUESTS
          - ATHLETE_NOT_FOUND
          type: string
        correlationId:
          type: string
        retryAfterSeconds:
          type:
          - 'null'
          - integer
          format: int32
        errors:
          type:
          - 'null'
          - object
          additionalProperties:
            type: array
            items:
              type: string
    AthleteDetail:
      required:
      - id
      - fullName
      - email
      - phone
      - dateOfBirth
      - gender
