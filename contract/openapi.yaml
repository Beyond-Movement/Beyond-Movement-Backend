  /api/v1/athletes:
    get:
      tags:
      - Athletes
      summary: The coach's athletes, searchable, filterable and sorted.
      description: 'search matches full name, email or sport, case-insensitively,
        on any part of the value, and is trimmed before use. Email is included so
        an athlete who has not yet completed their profile, and so has no name, is
        still findable. status filters by ACCOUNT status - whether the athlete can
        sign in - and is not the same as having an active package, which arrives in
        phase 4 as a separate parameter. sort accepts NameAsc, NameDesc, Sport, NewestFirst
        and OldestFirst; Sport places athletes with no sport last, and both name orders
        place athletes with no name last. page starts at 1 and pageSize is capped
        at 100 - values outside the range are clamped rather than rejected. Paused
        athletes are always included: pausing hides an athlete from themselves, never
        from their coach. Athletes who have registered but not completed their profile
        are also always included, with fullName null. Each row carries two ids and
        they are not interchangeable: id is the athlete''s USER id, which every /athletes/{athleteId}
        path takes, while athleteProfileId is the PROFILE id that sessions and purchased
        packages are keyed by - it is what POST /sessions/observations wants in its
        body. Both are always present.'
      operationId: ListAthletes
      parameters:
      - name: search
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          default: All
          $ref: '#/components/schemas/AthleteStatusFilter'
      - name: sort
        in: query
        schema:
          default: NameAsc
          $ref: '#/components/schemas/AthleteListSort'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResultOfAthleteListItem'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/athletes/{id}:
