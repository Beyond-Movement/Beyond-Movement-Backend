# Beyond Movement API contract.
# Generated from the running API: GET /openapi/v1.json, converted to YAML.
# Do not hand-edit - regenerate after changing an endpoint, and record the
# change in contract/CHANGELOG.md.
openapi: 3.1.1
info:
  title: BeyondMovement.Api | v1
  version: 1.0.0
servers:
- url: http://localhost:5229/
paths:
  /api/v1/ping:
    get:
      tags:
      - BeyondMovement.Api
      responses:
        '200':
          description: OK
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Create an account from a validated invitation, and redeem it.
      description: 'Post the registrationToken from /invitations/validate together with EITHER a password
        (plus fullName) OR a googleIdToken â€” exactly one, never both. With Google, the account''s verified
        email must match the invited address or the request is refused with GOOGLE_EMAIL_MISMATCH, and
        no name or password is needed. termsAccepted must be true. Returns the same token pair as login,
        so the app is signed in immediately, but profileCompleted is false: route to Complete Profile,
        not Home. The invitation is redeemed only on success, and re-posting the same token afterwards
        returns INVITATION_USED.'
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/athletes/me/profile:
    post:
      tags:
      - Athletes
      summary: Fill in the athlete's own profile after registration.
      description: Athlete-only, and always scoped to the caller's own profile â€” the user id comes from
        the token, never the body. Sets profileCompleted to true, after which /auth/me routes the app
        to Home instead of Complete Profile. Safe to call again to edit the details. Profile photo is
        not accepted yet; it needs file storage, which arrives in phase 13.
      operationId: CompleteAthleteProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteProfileRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteProfileResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Exchange email and password for an access token and a refresh token.
      description: Returns 401 INVALID_CREDENTIALS for both a wrong password and an unknown address â€”
        the two are deliberately indistinguishable. Returns 423 ACCOUNT_LOCKED after five failed attempts,
        with retryAfterSeconds and a Retry-After header. Returns 403 ACCOUNT_PAUSED when the credentials
        are correct but the account is paused.
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '423':
          description: Locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/google:
    post:
      tags:
      - Authentication
      summary: Sign in with a Google ID token obtained by the native sign-in on the device.
      description: Authentication only â€” it never creates an account (BR-01). If the Google account
        is unknown and no user exists with the same verified email, returns 403 INVITATION_REQUIRED. If
        a password account already exists for that verified email, the Google identity is linked to it
        and tokens are returned. Returns 401 INVALID_GOOGLE_TOKEN when the token fails verification or
        the Google email is unverified.
      operationId: GoogleSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token for a new token pair.
      description: 'Refresh tokens are single-use. Each call returns a NEW refresh token; store it and
        discard the old one. Replaying a token that was already spent is treated as theft: every token
        in that family is revoked and 401 INVALID_REFRESH_TOKEN is returned, so the user must sign in
        again. An expired or revoked token returns the same 401. Returns 403 ACCOUNT_PAUSED if the account
        was paused since the token was issued.'
      operationId: Refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the presented refresh token.
      description: Requires a valid access token as well as the refresh token in the body (architecture
        section 14.1 marks logout as authenticated). Succeeds even if the refresh token is already unknown
        or revoked, so a retry is safe.
      operationId: Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Send a password reset link to the address, if an account exists.
      description: Always returns 200, whether or not the address exists â€” it cannot be used to discover
        accounts, so never show a 'no account found' message. When an account does exist, an email is
        sent containing a deep link of the form beyondmovement://reset-password?token=<token>. The token
        is single-use, expires after one hour, and is URL-encoded in the link, so decode it before sending
        it to /auth/reset-password.
      operationId: ForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Set a new password using the token from the reset email.
      description: The token is single-use and valid for one hour; a used, unknown or expired token returns
        400 INVALID_RESET_TOKEN. On success every refresh token for that user is revoked, so any other
        signed-in device is signed out. Passwords must be at least 8 characters and are rejected if they
        appear on a common-password list; both arrive as 400 VALIDATION_FAILED with per-field messages
        in 'errors'.
      operationId: ResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication
      summary: Change the password while signed in.
      description: Requires the current password. Returns 401 INVALID_CREDENTIALS if it is wrong, and
        400 PASSWORD_NOT_SET for a Google-only account that has no password yet â€” those accounts set
        a first password through Forgot Password. On success every refresh token for the user is revoked,
        including this device's, so the app must sign in again.
      operationId: ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: The signed-in user, for restoring a session on app start.
      description: Read live from the database, not from the token, so a role or status changed since
        the token was issued is reflected immediately. Returns 403 ACCOUNT_PAUSED if the account was paused
        after this access token was issued â€” treat that as an immediate sign-out. When profileCompleted
        is false, route the user to Complete Profile rather than Home. minimumSupportedAppVersion drives
        the forced-upgrade prompt.
      operationId: CurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/validate:
    get:
      tags:
      - Invitations
      summary: Check an emailed invitation code and start account creation.
      description: Does NOT consume the invitation â€” it is redeemed only when the account is created,
        so a user may validate, abandon Create Account, and come back. Returns the invited email (show
        it read-only on Create Account; it is already verified, because only that inbox received the code)
        and a short-lived registrationToken to post to /auth/register. Failures distinguish INVITATION_INVALID,
        INVITATION_EXPIRED, INVITATION_USED and INVITATION_REVOKED so the error screen can say something
        useful. Rate-limited per IP; exceeding it returns 429 TOO_MANY_REQUESTS.
      operationId: ValidateInvitation
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateInvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '429':
          description: Too Many Requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/invitations:
    post:
      tags:
      - Invitations
      summary: Invite an athlete by email address.
      description: The backend generates the code and emails it directly to the address â€” the response
        never contains it, so the Admin cannot pass it on by another route. Re-inviting an address that
        already has a pending invitation replaces the old code rather than creating a second one. Returns
        409 EMAIL_ALREADY_REGISTERED if an account exists.
      operationId: CreateInvitation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
    get:
      tags:
      - Invitations
      summary: List invitations, newest first, optionally filtered by status.
      operationId: ListInvitations
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/InvitationStatus'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/{id}/resend:
    post:
      tags:
      - Invitations
      summary: Issue a fresh code and email it again.
      description: The previous code stops working immediately, so only one code is ever live.
      operationId: ResendInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/invitations/{id}:
    delete:
      tags:
      - Invitations
      summary: Cancel a pending invitation.
      description: An already-redeemed invitation cannot be revoked â€” deleting the account is a separate
        action.
      operationId: RevokeInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
components:
  schemas:
    ApiProblemDetails:
      required:
      - errorCode
      - correlationId
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          type: integer
          format: int32
        detail:
          type:
          - 'null'
          - string
        errorCode:
          enum:
          - VALIDATION_FAILED
          - INVALID_CREDENTIALS
          - ACCOUNT_LOCKED
          - ACCOUNT_PAUSED
          - INVALID_TOKEN
          - INVALID_REFRESH_TOKEN
          - INVALID_RESET_TOKEN
          - INVALID_GOOGLE_TOKEN
          - INVITATION_REQUIRED
          - PASSWORD_NOT_SET
          - INVITATION_INVALID
          - INVITATION_EXPIRED
          - INVITATION_USED
          - INVITATION_REVOKED
          - REGISTRATION_TOKEN_INVALID
          - GOOGLE_EMAIL_MISMATCH
          - TERMS_NOT_ACCEPTED
          - EMAIL_ALREADY_REGISTERED
          - PROFILE_ALREADY_COMPLETED
          - TOO_MANY_REQUESTS
          type: string
        correlationId:
          type: string
        retryAfterSeconds:
          type:
          - 'null'
          - integer
          format: int32
        errors:
          type:
          - 'null'
          - object
          additionalProperties:
            type: array
            items:
              type: string
    AthleteProfileResponse:
      required:
      - userId
      - fullName
      - email
      - dateOfBirth
      - gender
      - sport
      - profileCompleted
      type: object
      properties:
        userId:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        dateOfBirth:
          type:
          - 'null'
          - string
          format: date
        gender:
          type:
          - 'null'
          - string
        sport:
          type:
          - 'null'
          - string
        profileCompleted:
          type: boolean
    AuthResponse:
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
      - refreshExpiresInSeconds
      - user
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        refreshExpiresInSeconds:
          type: integer
          format: int32
        user:
          $ref: '#/components/schemas/UserSummary'
    ChangePasswordRequest:
      required:
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    CompleteProfileRequest:
      required:
      - fullName
      type: object
      properties:
        fullName:
          type: string
        dateOfBirth:
          type:
          - 'null'
          - string
          format: date
        gender:
          type:
          - 'null'
          - string
        sport:
          type:
          - 'null'
          - string
    CreateInvitationRequest:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    CurrentUserResponse:
      required:
      - id
      - role
      - status
      - fullName
      - email
      - coachId
      - profileCompleted
      - minimumSupportedAppVersion
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        fullName:
          type: string
        email:
          type: string
        coachId:
          type: string
          format: uuid
        profileCompleted:
          type: boolean
        minimumSupportedAppVersion:
          type: string
    ForgotPasswordRequest:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    GoogleSignInRequest:
      required:
      - idToken
      type: object
      properties:
        idToken:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    InvitationResponse:
      required:
      - id
      - email
      - status
      - expiresAtUtc
      - createdAtUtc
      - redeemedAtUtc
      - sendCount
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expiresAtUtc:
          type: string
          format: date-time
        createdAtUtc:
          type: string
          format: date-time
        redeemedAtUtc:
          type:
          - 'null'
          - string
          format: date-time
        sendCount:
          type: integer
          format: int32
    InvitationStatus:
      enum:
      - Pending
      - Redeemed
      - Revoked
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    LogoutRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    RefreshRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    RegisterRequest:
      required:
      - registrationToken
      - termsAccepted
      type: object
      properties:
        registrationToken:
          type: string
        termsAccepted:
          type: boolean
        password:
          type:
          - 'null'
          - string
        googleIdToken:
          type:
          - 'null'
          - string
        fullName:
          type:
          - 'null'
          - string
    ResetPasswordRequest:
      required:
      - token
      - newPassword
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
    UserRole:
      enum:
      - Admin
      - Athlete
    UserStatus:
      enum:
      - Active
      - Paused
      - Deleted
    UserSummary:
      required:
      - id
      - role
      - status
      - fullName
      - email
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        fullName:
          type: string
        email:
          type: string
    ValidateInvitationResponse:
      required:
      - email
      - expiresAtUtc
      - registrationToken
      - registrationTokenExpiresInSeconds
      type: object
      properties:
        email:
          type: string
        expiresAtUtc:
          type: string
          format: date-time
        registrationToken:
          type: string
        registrationTokenExpiresInSeconds:
          type: integer
          format: int32
  securitySchemes:
    bearerAuth:
      type: http
      description: Paste the accessToken returned by POST /api/v1/auth/login.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: BeyondMovement.Api
- name: Authentication
- name: Athletes
- name: Invitations
