  /api/v1/scheduling/session-types:
    get:
      tags:
      - Scheduling
      summary: The session types the athlete may book.
      description: 'Read live from Calendly on every call, and filtered twice: the
        event type must be active in Calendly and mapped in this API''s configuration,
        so a paused or unmapped type never reaches the app. id is the Calendly event
        type''s trailing identifier and is what /availability and POST /bookings take
        - it is not a database id. locations is what Calendly offers for that type:
        empty means there is no location choice to make, one entry means it is fixed,
        and more than one means the athlete must choose and send the chosen kind as
        locationKind when booking. Returns 503 CALENDLY_UNAVAILABLE when Calendly
        is not configured or is not answering - that is a transient failure, not an
        empty catalogue, and must not be shown as ''no sessions available''.'
      operationId: GetBookableSessionTypes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookableSessionType'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/scheduling/session-types/{eventTypeId}/availability:
    get:
      tags:
      - Scheduling
      summary: Bookable start times for one session type, in a UTC window.
      description: 'fromUtc and toUtc are both required, must both carry a UTC offset
        (Z), must be in the future and in order, and may span at most 7 days - anything
        else is 400 AVAILABILITY_RANGE_INVALID rather than a silently clamped range.
        Seven is Calendly''s own limit on an availability query, not a choice made
        here: ask for a month a week at a time. Each slot carries startUtc and endUtc,
        the end computed from the session type''s duration, so the client never has
        to add the minutes itself. The list is a snapshot: a slot can be taken between
        this call and the booking, which is why POST /bookings re-checks and can still
        answer 409 SLOT_UNAVAILABLE. An unknown or unmapped eventTypeId is 404 EVENT_TYPE_INVALID.'
      operationId: GetSessionTypeAvailability
      parameters:
      - name: eventTypeId
        in: path
        required: true
        schema:
          type: string
      - name: fromUtc
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: toUtc
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableSlot'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
