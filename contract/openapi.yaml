  /api/v1/athletes/{id}/pause:
    post:
      tags:
      - Athletes
      summary: Suspend an athlete's access.
      description: Sets account status to Paused and revokes every refresh token the
        athlete holds, so the session cannot be renewed. Their current access token
        stays valid for its remaining minutes, but each request re-checks status,
        so the next call returns 403 ACCOUNT_PAUSED - login does the same. The athlete
        stays visible to the coach and their data is untouched. Pausing an already-paused
        athlete succeeds and changes nothing, so a retry is safe. Push device tokens
        are NOT yet revoked; that table arrives with notifications in phase 10.
      operationId: PauseAthlete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AthleteStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
