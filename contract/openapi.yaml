# Beyond Movement API contract.
# Generated from the running API: GET /openapi/v1.json, converted to YAML.
# Do not hand-edit - regenerate after changing an endpoint, and record the
# change in contract/CHANGELOG.md.
openapi: 3.1.1
info:
  title: BeyondMovement.Api | v1
  version: 1.0.0
servers:
- url: http://localhost:5229/
paths:
  /api/v1/ping:
    get:
      tags:
      - BeyondMovement.Api
      responses:
        '200':
          description: OK
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Exchange email and password for an access token and a refresh token.
      description: Returns 401 INVALID_CREDENTIALS for both a wrong password and an unknown address â€”
        the two are deliberately indistinguishable. Returns 423 ACCOUNT_LOCKED after five failed attempts,
        with retryAfterSeconds and a Retry-After header. Returns 403 ACCOUNT_PAUSED when the credentials
        are correct but the account is paused.
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '423':
          description: Locked
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/google:
    post:
      tags:
      - Authentication
      summary: Sign in with a Google ID token obtained by the native sign-in on the device.
      description: Authentication only â€” it never creates an account (BR-01). If the Google account
        is unknown and no user exists with the same verified email, returns 403 INVITATION_REQUIRED. If
        a password account already exists for that verified email, the Google identity is linked to it
        and tokens are returned. Returns 401 INVALID_GOOGLE_TOKEN when the token fails verification or
        the Google email is unverified.
      operationId: GoogleSignIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token for a new token pair.
      description: 'Refresh tokens are single-use. Each call returns a NEW refresh token; store it and
        discard the old one. Replaying a token that was already spent is treated as theft: every token
        in that family is revoked and 401 INVALID_REFRESH_TOKEN is returned, so the user must sign in
        again. An expired or revoked token returns the same 401. Returns 403 ACCOUNT_PAUSED if the account
        was paused since the token was issued.'
      operationId: Refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Revoke the presented refresh token.
      description: Requires a valid access token as well as the refresh token in the body (architecture
        section 14.1 marks logout as authenticated). Succeeds even if the refresh token is already unknown
        or revoked, so a retry is safe.
      operationId: Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Send a password reset link to the address, if an account exists.
      description: Always returns 200, whether or not the address exists â€” it cannot be used to discover
        accounts, so never show a 'no account found' message. When an account does exist, an email is
        sent containing a deep link of the form beyondmovement://reset-password?token=<token>. The token
        is single-use, expires after one hour, and is URL-encoded in the link, so decode it before sending
        it to /auth/reset-password.
      operationId: ForgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Set a new password using the token from the reset email.
      description: The token is single-use and valid for one hour; a used, unknown or expired token returns
        400 INVALID_RESET_TOKEN. On success every refresh token for that user is revoked, so any other
        signed-in device is signed out. Passwords must be at least 8 characters and are rejected if they
        appear on a common-password list; both arrive as 400 VALIDATION_FAILED with per-field messages
        in 'errors'.
      operationId: ResetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication
      summary: Change the password while signed in.
      description: Requires the current password. Returns 401 INVALID_CREDENTIALS if it is wrong, and
        400 PASSWORD_NOT_SET for a Google-only account that has no password yet â€” those accounts set
        a first password through Forgot Password. On success every refresh token for the user is revoked,
        including this device's, so the app must sign in again.
      operationId: ChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: The signed-in user, for restoring a session on app start.
      description: Read live from the database, not from the token, so a role or status changed since
        the token was issued is reflected immediately. Returns 403 ACCOUNT_PAUSED if the account was paused
        after this access token was issued â€” treat that as an immediate sign-out. When profileCompleted
        is false, route the user to Complete Profile rather than Home. minimumSupportedAppVersion drives
        the forced-upgrade prompt.
      operationId: CurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
components:
  schemas:
    ApiProblemDetails:
      required:
      - errorCode
      - correlationId
      type: object
      properties:
        type:
          type:
          - 'null'
          - string
        title:
          type:
          - 'null'
          - string
        status:
          type: integer
          format: int32
        detail:
          type:
          - 'null'
          - string
        errorCode:
          enum:
          - VALIDATION_FAILED
          - INVALID_CREDENTIALS
          - ACCOUNT_LOCKED
          - ACCOUNT_PAUSED
          - INVALID_TOKEN
          - INVALID_REFRESH_TOKEN
          - INVALID_RESET_TOKEN
          - INVALID_GOOGLE_TOKEN
          - INVITATION_REQUIRED
          - PASSWORD_NOT_SET
          type: string
        correlationId:
          type: string
        retryAfterSeconds:
          type:
          - 'null'
          - integer
          format: int32
        errors:
          type:
          - 'null'
          - object
          additionalProperties:
            type: array
            items:
              type: string
    AuthResponse:
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
      - refreshExpiresInSeconds
      - user
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int32
        refreshExpiresInSeconds:
          type: integer
          format: int32
        user:
          $ref: '#/components/schemas/UserSummary'
    ChangePasswordRequest:
      required:
      - currentPassword
      - newPassword
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    CurrentUserResponse:
      required:
      - id
      - role
      - status
      - fullName
      - email
      - coachId
      - profileCompleted
      - minimumSupportedAppVersion
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        fullName:
          type: string
        email:
          type: string
        coachId:
          type: string
          format: uuid
        profileCompleted:
          type: boolean
        minimumSupportedAppVersion:
          type: string
    ForgotPasswordRequest:
      required:
      - email
      type: object
      properties:
        email:
          type: string
    GoogleSignInRequest:
      required:
      - idToken
      type: object
      properties:
        idToken:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    LogoutRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
    RefreshRequest:
      required:
      - refreshToken
      type: object
      properties:
        refreshToken:
          type: string
        deviceId:
          type:
          - 'null'
          - string
    ResetPasswordRequest:
      required:
      - token
      - newPassword
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
    UserRole:
      enum:
      - Admin
      - Athlete
    UserStatus:
      enum:
      - Active
      - Paused
      - Deleted
    UserSummary:
      required:
      - id
      - role
      - status
      - fullName
      - email
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        fullName:
          type: string
        email:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      description: Paste the accessToken returned by POST /api/v1/auth/login.
      scheme: bearer
      bearerFormat: JWT
tags:
- name: BeyondMovement.Api
- name: Authentication
