      description: 'Always books for the caller''s own athlete profile - there is
        no athlete id in the body and an Admin cannot book on someone''s behalf here.
        Idempotency-Key is required and is remembered per athlete: replaying the same
        key returns the session that key already created rather than booking a second
        one, and returns 409 BOOKING_IN_PROGRESS with Retry-After while the first
        attempt is still in flight. Generate the key once per booking attempt and
        keep it across retries. startUtc must be UTC, in the future, and match an
        available slot exactly; timeZone is an IANA name such as Africa/Cairo and
        is what the Calendly invitation is written in. locationKind is required only
        when the session type offers a choice - 400 LOCATION_REQUIRED and LOCATION_INVALID
        say which. Returns 201 with the created session, including meetingUrl for
        an online session and the rescheduleUrl the app opens later.'
      operationId: BookSession
