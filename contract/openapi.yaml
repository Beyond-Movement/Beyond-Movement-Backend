  /api/v1/sessions:
    get:
      tags:
      - Sessions
      summary: The caller's sessions, earliest start first, one page at a time.
      description: An athlete sees only their own sessions and athleteProfileId is
        ignored for them; an Admin sees the coach's sessions and may narrow to one
        athlete with it. fromUtc is inclusive and toUtc exclusive, both UTC. limit
        is clamped to 1-100, and 0 means 30. cursor carries the start time the next
        page resumes after - treat it as opaque and pass nextCursor back unchanged.
        A null nextCursor is the last page; a non-null one means at least one more
        session follows, so page until it is null rather than until a short page.
        An athlete with no profile gets an empty page, not an error. athleteName is
        carried on every session so an Admin schedule can be drawn without a second
        call per row; it is the athlete's full name, or their email address if they
        have not completed their profile yet.
      operationId: ListSessions
      parameters:
      - name: fromUtc
        in: query
        schema:
          type: string
          format: date-time
      - name: toUtc
        in: query
        schema:
          type: string
          format: date-time
