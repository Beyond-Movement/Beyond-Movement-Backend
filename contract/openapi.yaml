      summary: Mark a session attended or a no-show, deducting once.
      description: 'The only endpoint that moves a package balance. outcome is Attended
        or NoShow and defaults to Attended. NoShow requires deductSession: true consumes
        exactly one package session and false consumes none. deductSession must be
        omitted for Attended. Cancelled is not accepted here because cancelling also
        has to reach Calendly and has its own endpoint. How much it deducts is decided
        server-side and returned as consumedSessionCount: one for an ordinary attended
        session (BR-05), for an attended observation the deductSession choice the
        Admin made when recording it (BR-07), and for a no-show the explicit deductSession
        choice in this request. Note that those are two different fields: the one
        on this request decides a no-show here and now, while an observation''s was
        decided at creation and is reported as observationDeductsSession. The response
        carries the session and the package as they now stand, both changed in one
        transaction, so the client can replace its copies without re-reading and without
        ever showing a balance that did not exist. package and progress are null when
        the session consumed nothing and the athlete has no active package. Marking
        a session that is already Attended is 409 SESSION_ALREADY_ATTENDED, already
        a no-show is 409 SESSION_ALREADY_RESOLVED, and cancelled is 409 SESSION_CANCELLED
        (BR-06). Those are not failures to retry past - they mean the deduction has
        already happened exactly once, or must never happen. A session that would
        deduct from an athlete with no active package is 409 ACTIVE_PACKAGE_NOT_FOUND,
        and one whose package is exhausted is 409 NO_SESSIONS_REMAINING. Two requests
        racing produce one success and one 409 CONCURRENCY_CONFLICT, never two deductions.'
      operationId: MarkSessionAttendance
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkAttendanceRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/sessions/{id}/package-progress:
    get:
      tags:
      - Attendance
      summary: Where a session sits in the athlete's package - "Session 7 of 12".
      description: Separate from GET /sessions/{id} rather than added to it, so the
        Phase 5 session shape the app already reads does not change. sessionNumber
        is the session's own position once it has been attended, and the position
        it would take if it has not been resolved yet, which is what Session Details
        shows before the coach taps Mark as Attended. It is null when no position
        exists to state - a cancelled session, or an observation the Admin chose not
        to deduct, neither of which will ever consume one. 404 SESSION_NOT_FOUND covers
        an unknown session and someone else's alike; an athlete with no package at
        all gets 404 PACKAGE_NOT_FOUND, which is a normal state and not an error worth
        surfacing as one.
      operationId: GetSessionPackageProgress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPackageProgress'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/sessions/observations:
    post:
      tags:
      - Attendance
      summary: Record an observation the coach carried out.
      description: 'The one kind of session this API creates itself. Observations
        are arranged in person and never appear on a Calendly booking page, so the
        coach records one directly; everything else is projected from Calendly and
        cannot be created here. The dates may be in the past or the future - an observation
        already carried out, or one agreed for next week. deductSession is required
        and is the Admin''s explicit choice about whether attending this observation
        consumes one package session (BR-07): true consumes exactly one, false consumes
        none, and duration has no bearing on it. Creating the observation deducts
        nothing whichever is chosen - the session is created Scheduled and a booking
        never deducts (BR-04). The choice is stored, returned as observationDeductsSession,
        and applied when the session is marked attended. startUtc and endUtc must
        both be UTC and in order, and may not span more than a day. athleteProfileId
        is the profile id carried on every session, not the athlete''s user id.'
      operationId: CreateObservation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateObservationRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/sessions/{sessionId}/notes:
    get:
      tags:
      - Session notes
      summary: The notes on one session, oldest first.
      description: Oldest first, because they read as a running record of the session
        rather than a feed. An empty list is normal. An unknown session, or one belonging
        to another coach, is 404 SESSION_NOT_FOUND.
      operationId: ListSessionNotes
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionNoteResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
    post:
      tags:
      - Session notes
      summary: Add a note to a session.
      description: 'A session holds many notes rather than one editable block: the
        screen offers add as well as edit, and a record that can only be overwritten
        loses what was written last time the first time something is added this time.
        Notes can be added to a session in any status - the coach often writes them
        up after it has been marked attended, and a cancelled session can still be
        worth a line saying why.'
      operationId: CreateSessionNote
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSessionNoteRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNoteResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
  /api/v1/sessions/{sessionId}/notes/{noteId}:
    put:
      tags:
      - Session notes
      summary: Rewrite a note.
      description: Replaces the text. createdAtUtc deliberately stays put so the history
        keeps its order when a note written days ago is corrected today; updatedAtUtc
        moves. 404 SESSION_NOTE_NOT_FOUND covers a note that does not exist and one
        that belongs to a different session alike.
      operationId: EditSessionNote
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSessionNoteRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionNoteResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Session notes
      summary: Remove a note.
      description: 204 with no body. Deleting a note that is already gone is 404 SESSION_NOTE_NOT_FOUND
        rather than a silent success, so a client that thinks it deleted something
        twice finds out.
      operationId: DeleteSessionNote
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: noteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblemDetails'
      security:
      - bearerAuth: []
