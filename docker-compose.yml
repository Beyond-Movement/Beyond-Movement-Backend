services:
  postgres:
    image: postgres:16
    container_name: mc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port comes from .env — 5432 is taken by a local PostgreSQL service
      # on some machines, so it is configurable rather than hard-coded.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - mc-pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mc-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: mc-redis
    ports:
      - "6379:6379"

  # Local mail server. Accepts everything the API sends and delivers nothing to the
  # outside world, so invitation and reset emails can be opened and clicked during
  # development with no Postmark account and no verified domain.
  # Architecture section 16.1 names MailHog for this role; Mailpit is its maintained
  # successor and speaks the same SMTP.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mc-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # web inbox — http://localhost:8025
      - "1025:1025"   # SMTP, where the API sends

volumes:
  mc-pgdata:
